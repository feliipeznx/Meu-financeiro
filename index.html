<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114"><title>Meu Financeiro - Painel Premium</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b20;--panel2:#23262e;--line:#30343d;--muted:#9ba3b2;--text:#f4f5f7;--green:#35c987;--red:#ff6877;--blue:#79a9ff;--yellow:#f4c66a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:82px}header{padding:19px 17px 13px;position:sticky;top:0;background:#101114f2;backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--line)}.brand{font-size:22px;font-weight:850}.sub{color:var(--muted);font-size:11px;margin-top:2px}main{max-width:850px;margin:auto;padding:15px}.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 12px}.tabs button{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:10px 12px;font-weight:700}.tabs button.active{background:#244235;border-color:#286a4d;color:#b7f4d5}.hero{background:linear-gradient(135deg,#222b31,#17191e);border:1px solid #343b43;border-radius:17px;padding:17px;margin-bottom:12px}.eyebrow,.muted,small{color:var(--muted)}.total{font-size:29px;font-weight:850;margin:5px 0 14px;letter-spacing:-.7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px}.metric strong{display:block;font-size:17px;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.yellow{color:var(--yellow)}.actions{display:flex;gap:8px;margin:13px 0;flex-wrap:wrap}.primary,.secondary,.danger{border:0;border-radius:11px;padding:11px 13px;font-weight:750;font-size:13px}.primary{background:var(--green);color:#07150f}.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.danger{background:#49232a;color:#ffdbe0}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:19px 0 9px}.sectionhead h2{font-size:16px;margin:0}.rowitem{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.rowitem:last-child{border:0}.ico{width:36px;height:36px;border-radius:11px;background:var(--panel2);display:grid;place-items:center;font-size:17px;flex-shrink:0}.grow{flex:1;min-width:0}.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.amount{font-weight:750;white-space:nowrap}.empty{text-align:center;padding:23px 8px;color:var(--muted)}.tag{font-size:10px;border:1px solid var(--line);border-radius:20px;padding:3px 7px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;color:var(--muted);font-size:11px;margin:11px 0 5px}input,select,textarea{width:100%;background:#111318;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px;font:inherit;min-width:0}textarea{resize:vertical}.full{grid-column:1/-1}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:var(--panel);width:min(100%,620px);max-height:92vh;overflow:auto;border-radius:19px 19px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 10px}.formactions{display:flex;gap:8px;margin-top:16px}.formactions button{flex:1}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#17191e;border-top:1px solid var(--line);padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:6}nav button{background:none;border:0;color:var(--muted);font-size:10px;display:grid;justify-items:center;gap:3px}nav span{font-size:18px}nav button.active{color:var(--green)}.notice{font-size:10px;line-height:1.5;color:var(--muted);margin-top:13px}.hidden{display:none!important}.pillrow{display:flex;gap:6px;flex-wrap:wrap}.pill{background:var(--panel2);border:1px solid var(--line);padding:7px 9px;border-radius:9px;font-size:11px}.progress{height:7px;background:#30343d;border-radius:9px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:var(--green)}.chart{display:flex;align-items:flex-end;gap:9px;height:170px;padding:12px 4px 0;border-bottom:1px solid var(--line)}.monthcol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}.bars{height:132px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}.bar{width:42%;min-width:7px;border-radius:5px 5px 0 0;min-height:3px}.bar.in{background:var(--green)}.bar.out{background:var(--red)}.monthlabel{font-size:10px;color:var(--muted)}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 0;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}@media(min-width:650px){main{padding:22px}.modal{align-items:center}.sheet{border-radius:18px}}

/* PAINEL PREMIUM */
:root{--bg:#111113;--panel:#1d1c1b;--panel2:#2b2926;--line:#39352f;--muted:#b0a99d;--text:#f7f1e7;--green:#d8bd7a;--red:#ef7e72;--blue:#9cb6d0;--yellow:#e4c982}
body{background:radial-gradient(ellipse at 10% 0%,#3a3020 0,transparent 35%),#111113}
.tabs button.active{background:#493d27;border-color:#8b7442;color:#f5dfaa}nav button.active{color:var(--yellow)}
.primary{background:linear-gradient(135deg,#e4cc8e,#b18c4d);color:#211b10}
.premium-head{display:flex;justify-content:space-between;align-items:center;margin:10px 0 17px}.premium-mark{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-weight:900;font-size:19px;color:#211b10;background:linear-gradient(135deg,#f0d99d,#9f7a3c);box-shadow:0 8px 25px #b18c4d33}
.premium-balance{padding:23px;border-radius:20px;background:linear-gradient(130deg,#54442a,#29231a 75%);border:1px solid #8b7442;box-shadow:0 14px 35px #0004}
.premium-balance-label{font-size:10px;letter-spacing:1.5px;color:#e6d3a5}.premium-total{font-size:34px;font-weight:900;letter-spacing:-1px;margin:10px 0 16px;color:#fff6df}
.premium-foot{display:flex;gap:18px;flex-wrap:wrap;color:#e9dcbf;font-size:11px}
.premium-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}.premium-grid .metric{background:linear-gradient(145deg,#24221e,#191817);border-color:#39342b}.premium-grid .metric strong{font-size:16px}
.premium-panels{display:grid;grid-template-columns:1fr;gap:10px}
.premium-line{font-size:12px}.premium-line b{color:var(--yellow)}
.dash-premium .panel{box-shadow:0 8px 22px #0003}
@media(min-width:680px){.premium-panels{grid-template-columns:1fr 1fr}.premium-total{font-size:42px}}

</style></head>
<body>
<header><div class="brand">Meu Financeiro <span style="font-size:11px;color:var(--muted);font-weight:600">· Painel Premium</span></div><div class="sub">Gestão pessoal e empresarial · Preparado para MEI</div></header>
<main>
<div class="tabs" id="tabs">
<button class="active" data-page="inicio">Visão geral</button><button data-page="mov">Movimentações</button><button data-page="despesas">Despesas</button><button data-page="vendas">Vendas</button><button data-page="produtos">Produtos / estoque</button><button data-page="contatos">Clientes / fornecedores</button><button data-page="contas">Contas</button><button data-page="relatorios">Relatórios</button><button data-page="config">Configurações</button>
</div>
<div id="app"></div>
</main>
<nav><button class="active" data-go="inicio"><span>⌂</span>Início</button><button data-go="mov"><span>⇄</span>Movimentar</button><button data-go="vendas"><span>🛒</span>Vendas</button><button data-go="produtos"><span>▦</span>Estoque</button><button data-go="relatorios"><span>▥</span>Relatórios</button></nav>
<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle"></h2><form id="form"></form></div></div>
<script>
const KEY='mf_complete_v2';
const blank={transactions:[],products:[],sales:[],contacts:[],bills:[],settings:{businessName:'Minha empresa',status:'premei',cnpj:'',meiStart:'',notes:''}};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||blank, page='inicio', scope='empresa', formType='';
const $=id=>document.getElementById(id), money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), today=()=>new Date().toISOString().slice(0,10);
function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sum(a,fn){return a.reduce((s,x)=>s+fn(x),0)}
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===p));render()}
$('tabs').onclick=e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)};
document.querySelector('nav').onclick=e=>{let b=e.target.closest('[data-go]');if(b)go(b.dataset.go)};
function addBtn(label,type){return `<button class="primary" onclick="openForm('${type}')">＋ ${label}</button>`}
function card(label,value,cls=''){return `<div class="metric"><span class="eyebrow">${label}</span><strong class="${cls}">${money(value)}</strong></div>`}
function moduleSelect(){return `<label>Módulo</label><select name="scope"><option value="empresa" ${scope==='empresa'?'selected':''}>Empresarial</option><option value="pessoal" ${scope==='pessoal'?'selected':''}>Pessoal</option></select>`}
function filteredTx(){return db.transactions.filter(t=>t.scope===scope)}
function monthlyChart(){
let months=[];
for(let i=5;i>=0;i--){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');months.push({key,label:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')})}
let data=months.map(m=>({...m,inc:sum(db.transactions.filter(t=>t.scope===scope&&t.type==='entrada'&&String(t.date||'').slice(0,7)===m.key),t=>+t.amount),out:sum(db.transactions.filter(t=>t.scope===scope&&t.type==='saida'&&String(t.date||'').slice(0,7)===m.key),t=>+t.amount)}));
let max=Math.max(1,...data.flatMap(x=>[x.inc,x.out]));
return `<div class="sectionhead"><h2>Entradas x despesas</h2><span class="tag">ÚLTIMOS 6 MESES</span></div><div class="panel"><div class="chart">${data.map(m=>`<div class="monthcol"><div class="bars"><div class="bar in" title="Entradas: ${money(m.inc)}" style="height:${Math.max(3,m.inc/max*100)}%"></div><div class="bar out" title="Despesas: ${money(m.out)}" style="height:${Math.max(3,m.out/max*100)}%"></div></div><span class="monthlabel">${m.label}</span></div>`).join('')}</div><div class="legend"><span><i class="dot" style="background:var(--green)"></i>Entradas</span><span><i class="dot" style="background:var(--red)"></i>Despesas</span></div><p class="notice">O gráfico considera os lançamentos registrados no módulo ${scope==='empresa'?'empresarial':'pessoal'}.</p></div>`
}

function dashboard(){
const tx=filteredTx();
const inc=sum(tx.filter(x=>x.type==='entrada'),x=>+x.amount);
const out=sum(tx.filter(x=>x.type==='saida'),x=>+x.amount);
const balance=inc-out;
const stock=sum(db.products,x=>x.qty*x.cost);
const sales=sum(db.sales,x=>+x.total);
const profit=sum(db.sales,x=>+x.profit);
const openBills=db.bills.filter(x=>x.status==='aberta');
const payable=sum(openBills.filter(x=>x.kind==='Pagar'),x=>+x.amount);
const receivable=sum(openBills.filter(x=>x.kind==='Receber'),x=>+x.amount);
const lowStock=db.products.filter(p=>Number(p.qty)<=Number(p.min));
const recent=tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
const sources={};
tx.filter(t=>t.type==='entrada').forEach(t=>{const k=t.origin||t.category||'Não informado';sources[k]=(sources[k]||0)+Number(t.amount||0)});
const expenses={};
tx.filter(t=>t.type==='saida').forEach(t=>{const k=t.category||'Outros';expenses[k]=(expenses[k]||0)+Number(t.amount||0)});
const topSources=Object.entries(sources).sort((a,b)=>b[1]-a[1]).slice(0,4);
const topExpenses=Object.entries(expenses).sort((a,b)=>b[1]-a[1]).slice(0,4);
const due=openBills.slice().sort((a,b)=>a.due.localeCompare(b.due)).slice(0,4);
const pct=inc?Math.max(0,Math.min(100,balance/inc*100)):0;
const scopeName=scope==='empresa'?'EMPRESARIAL':'PESSOAL';
return `<div class="dash-premium">
 <div class="premium-head"><div><span class="kicker">MEU FINANCEIRO / DASHBOARD</span><h1>Olá! Aqui está seu resumo.</h1><p>Modo ${scopeName.toLowerCase()} · Seus indicadores em um só lugar</p></div><div class="premium-mark">MF</div></div>
 <div class="scope-switch"><button class="pill" onclick="scope='empresa';render()">◈ Empresarial</button><button class="pill" onclick="scope='pessoal';render()">◉ Pessoal</button></div>
 <div class="premium-balance"><div class="premium-balance-label">SALDO DISPONÍVEL REGISTRADO</div><div class="premium-total">${money(balance)}</div><div class="premium-foot"><span>↗ ${money(inc)} entradas</span><span>↘ ${money(out)} despesas</span></div></div>
 <div class="premium-grid">${card('Faturamento / entradas',inc,'green')}${card('Despesas totais',out,'red')}${card('A receber',receivable,'blue')}${card('A pagar',payable,'yellow')}</div>
 <div class="sectionhead"><h2>Desempenho mensal</h2><span class="tag">ÚLTIMOS 6 MESES</span></div>${monthlyChart()}
 <div class="premium-grid">${card('Vendas',scope==='empresa'?sales:0,'blue')}${card('Lucro bruto estimado',scope==='empresa'?profit:0,'green')}${card('Estoque a custo',scope==='empresa'?stock:0,'yellow')}${card('Itens em falta / baixo estoque',scope==='empresa'?lowStock.length:0,lowStock.length?'red':'green')}</div>
 <div class="premium-panels"><div><div class="sectionhead"><h2>Fontes de receita</h2></div><div class="panel">${topSources.length?topSources.map(([k,v])=>`<div class="premium-line"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join(''):'<div class="empty">Informe a origem ao registrar uma entrada.</div>'}</div></div><div><div class="sectionhead"><h2>Para onde está indo</h2></div><div class="panel">${topExpenses.length?topExpenses.map(([k,v])=>`<div class="premium-line"><span>${esc(k)}</span><b class="red">${money(v)}</b></div>`).join(''):'<div class="empty">Registre despesas para ver as categorias.</div>'}</div></div></div>
 <div class="sectionhead"><h2>Atalhos rápidos</h2></div><div class="actions">${addBtn('Adicionar entrada','tx-in')}${addBtn('Adicionar despesa','tx-out')}${scope==='empresa'?addBtn('Registrar venda','sale'):''}<button class="secondary" onclick="go('contas')">Ver contas</button></div>
 <div class="sectionhead"><h2>Atividade recente</h2><button class="secondary" onclick="go('mov')">Abrir histórico</button></div>${txList(recent)}
 <p class="notice">Indicadores gerenciais calculados a partir dos dados cadastrados. Lucro bruto é estimado e pode não incluir todos os custos e tributos.</p>
</div>`;
}

function txList(list){if(!list.length)return '<div class="panel empty">Nenhum lançamento cadastrado ainda.</div>';return `<div class="panel">${list.map(t=>`<div class="rowitem"><div class="ico">${t.type==='entrada'?'↙':'↗'}</div><div class="grow"><b>${esc(t.desc)}</b><small>${esc(t.category)} · ${new Date(t.date+'T12:00:00').toLocaleDateString('pt-BR')} · ${t.scope==='empresa'?'Empresa':'Pessoal'}${t.origin?' · Origem: '+esc(t.origin):''}${t.destination?' · Para: '+esc(t.destination):''}${t.dueDate?' · Venc.: '+new Date(t.dueDate+'T12:00:00').toLocaleDateString('pt-BR'):''}</small></div><div class="amount ${t.type==='entrada'?'green':'red'}">${t.type==='entrada'?'+':'−'}${money(t.amount)}</div><button class="secondary" onclick="removeItem('transactions',${t.id})">×</button></div>`).join('')}</div>`}
function expensesPage(){
let list=db.transactions.filter(t=>t.scope===scope&&t.type==='saida').slice().sort((a,b)=>b.date.localeCompare(a.date));
return `<div class="sectionhead"><h2>Despesas</h2><span class="tag">${scope==='empresa'?'EMPRESARIAL':'PESSOAL'}</span></div><div class="pillrow"><button class="pill" onclick="scope='empresa';go('despesas')">Empresarial</button><button class="pill" onclick="scope='pessoal';go('despesas')">Pessoal</button></div><div class="actions">${addBtn('Registrar despesa','tx-out')}</div><div class="grid">${card('Total de despesas',sum(list,x=>+x.amount),'red')}${card('Quantidade de registros',list.length,'blue')}</div><div class="sectionhead"><h2>Histórico de despesas</h2></div>${txList(list)}`
}
function movements(){let list=db.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="sectionhead"><h2>Movimentações</h2></div><div class="actions">${addBtn('Entrada','tx-in')}${addBtn('Saída','tx-out')}</div><div class="pillrow"><button class="pill" onclick="scope='empresa';go('mov')">Empresarial</button><button class="pill" onclick="scope='pessoal';go('mov')">Pessoal</button></div>${txList(list.filter(t=>t.scope===scope))}`}
function salesPage(){return `<div class="sectionhead"><h2>Vendas e serviços</h2>${addBtn('Nova venda','sale')}</div><div class="grid">${card('Faturamento registrado',sum(db.sales,x=>+x.total),'blue')}${card('Lucro bruto estimado',sum(db.sales,x=>+x.profit),'green')}</div><div class="sectionhead"><h2>Histórico de vendas</h2></div>${db.sales.length?`<div class="panel">${db.sales.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<div class="rowitem"><div class="ico">🧾</div><div class="grow"><b>${esc(s.item)} · ${esc(s.client||'Consumidor')}</b><small>${new Date(s.date+'T12:00:00').toLocaleDateString('pt-BR')} · ${s.qty} un.</small></div><div class="amount"><span class="green">${money(s.total)}</span><small style="display:block">Lucro ${money(s.profit)}</small></div><button class="secondary" onclick="removeItem('sales',${s.id})">×</button></div>`).join('')}</div>`:'<div class="panel empty">Cadastre sua primeira venda ou serviço.</div>'}`}
function productsPage(){return `<div class="sectionhead"><h2>Produtos e estoque</h2>${addBtn('Cadastrar produto','product')}</div><div class="grid">${card('Itens cadastrados',db.products.length,'blue')}${card('Valor de custo em estoque',sum(db.products,p=>p.qty*p.cost),'green')}</div><div class="sectionhead"><h2>Catálogo</h2></div>${db.products.length?`<div class="panel">${db.products.map(p=>`<div class="rowitem"><div class="ico">📦</div><div class="grow"><b>${esc(p.name)}</b><small>SKU: ${esc(p.sku||'—')} · Custo ${money(p.cost)} · Venda ${money(p.price)}</small></div><div class="amount">${p.qty} un.<small style="display:block">${p.qty<=p.min?'<span class="red">Estoque baixo</span>':'em estoque'}</small></div><button class="secondary" onclick="removeItem('products',${p.id})">×</button></div>`).join('')}</div>`:'<div class="panel empty">Nenhum produto cadastrado.</div>'}`}
function contactsPage(){return `<div class="sectionhead"><h2>Clientes e fornecedores</h2>${addBtn('Novo contato','contact')}</div>${db.contacts.length?`<div class="panel">${db.contacts.map(c=>`<div class="rowitem"><div class="ico">${c.kind==='Cliente'?'👤':'🏭'}</div><div class="grow"><b>${esc(c.name)}</b><small>${esc(c.kind)} · ${esc(c.phone||'Sem telefone')} · ${esc(c.doc||'')}</small></div><button class="secondary" onclick="removeItem('contacts',${c.id})">×</button></div>`).join('')}</div>`:'<div class="panel empty">Cadastre seus clientes e fornecedores para organizar os contatos.</div>'}`}
function billsPage(){return `<div class="sectionhead"><h2>Contas a pagar e receber</h2>${addBtn('Nova conta','bill')}</div><div class="grid">${card('A pagar',sum(db.bills.filter(b=>b.kind==='Pagar'&&b.status==='aberta'),b=>+b.amount),'red')}${card('A receber',sum(db.bills.filter(b=>b.kind==='Receber'&&b.status==='aberta'),b=>+b.amount),'green')}</div>${db.bills.length?`<div class="panel">${db.bills.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(b=>`<div class="rowitem"><div class="ico">${b.kind==='Pagar'?'📤':'📥'}</div><div class="grow"><b>${esc(b.desc)}</b><small>${b.kind} · vence ${new Date(b.due+'T12:00:00').toLocaleDateString('pt-BR')} · ${b.status}</small></div><div class="amount">${money(b.amount)}</div>${b.status==='aberta'?`<button class="secondary" onclick="settleBill(${b.id})">Baixar</button>`:''}<button class="secondary" onclick="removeItem('bills',${b.id})">×</button></div>`).join('')}</div>`:'<div class="panel empty">Nenhuma conta cadastrada.</div>'}`}
function reports(){let revenue=sum(db.sales,s=>+s.total),cost=sum(db.sales,s=>+s.cost),gross=revenue-cost,expense=sum(db.transactions.filter(t=>t.scope==='empresa'&&t.type==='saida'),t=>+t.amount);let byCat={};db.transactions.filter(t=>t.scope==='empresa'&&t.type==='saida').forEach(t=>byCat[t.category]=(byCat[t.category]||0)+ +t.amount);return `<div class="sectionhead"><h2>Relatórios gerenciais</h2><button class="secondary" onclick="exportCSV()">Exportar CSV</button></div><div class="grid">${card('Faturamento em vendas',revenue,'blue')}${card('Custo estimado vendido',cost,'yellow')}${card('Lucro bruto estimado',gross,'green')}${card('Despesas lançadas',expense,'red')}</div><div class="sectionhead"><h2>Despesas empresariais por categoria</h2></div><div class="panel">${Object.keys(byCat).length?Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><b>${esc(k)}</b><span>${money(v)}</span></div><div class="progress"><i style="width:${Math.min(100,expense?v/expense*100:0)}%"></i></div></div>`).join(''):'<div class="empty">Registre despesas para visualizar a distribuição.</div>'}</div><p class="notice">Relatório gerencial, não fiscal. O lucro não considera automaticamente impostos, pró-labore, taxas de cartão, perdas, depreciação ou outros custos não lançados.</p>`}
function config(){let s=db.settings;return `<div class="sectionhead"><h2>Dados da empresa</h2></div><div class="panel"><form id="settingsForm"><label>Nome fantasia / nome de referência</label><input name="businessName" value="${esc(s.businessName)}"><label>Situação atual</label><select name="status"><option value="premei" ${s.status==='premei'?'selected':''}>Ainda sem MEI / preparando abertura</option><option value="mei" ${s.status==='mei'?'selected':''}>MEI aberto</option><option value="other" ${s.status==='other'?'selected':''}>Outra natureza empresarial</option></select><label>CNPJ (quando tiver)</label><input name="cnpj" value="${esc(s.cnpj)}" placeholder="Deixe vazio até abrir"><label>Data de abertura</label><input name="meiStart" type="date" value="${esc(s.meiStart)}"><label>Observações</label><textarea name="notes" rows="3">${esc(s.notes)}</textarea><div class="formactions"><button class="primary">Salvar dados</button></div></form></div><div class="sectionhead"><h2>Backup e segurança</h2></div><div class="panel"><div class="actions"><button class="secondary" onclick="backup()">Baixar backup completo</button><button class="secondary" onclick="$('restore').click()">Restaurar backup</button><input id="restore" type="file" accept="application/json" class="hidden" onchange="restoreBackup(event)"></div><button class="danger" onclick="clearAll()">Apagar todos os dados</button></div><p class="notice">O sistema guarda informações neste navegador. Faça backup frequente. Não insira senhas bancárias, dados completos de cartão ou informações sensíveis de clientes.</p>`}
function render(){let el=$('app');el.innerHTML=({inicio:dashboard,mov:movements,despesas:expensesPage,vendas:salesPage,produtos:productsPage,contatos:contactsPage,contas:billsPage,relatorios:reports,config})[page]();let sf=$('settingsForm');if(sf)sf.onsubmit=e=>{e.preventDefault();db.settings=Object.fromEntries(new FormData(sf));persist();alert('Dados da empresa salvos.')}}
function openForm(type){formType=type;let title='',fields='';const input=(label,name,opts={})=>`<div class="${opts.full?'full':''}"><label>${label}</label><input name="${name}" ${opts.type?'type="'+opts.type+'"':''} ${opts.required===false?'':'required'} ${opts.step?'step="'+opts.step+'"':''} ${opts.min?'min="'+opts.min+'"':''} ${opts.value!==undefined?'value="'+esc(opts.value)+'"':''} ${opts.placeholder?'placeholder="'+opts.placeholder+'"':''}></div>`;
if(type==='tx-in'||type==='tx-out'){let incoming=type==='tx-in';title=incoming?'Lançar entrada':'Lançar saída';fields=`${moduleSelect()}<div class="formgrid">${input(incoming?'Descrição da entrada':'Descrição da despesa','desc',{full:true})}${input('Valor (R$)','amount',{type:'number',step:'0.01',min:'0.01'})}<div><label>Data do lançamento</label><input name="date" type="date" value="${today()}" required></div><div><label>Categoria</label><select name="category">${(incoming?['Venda','Serviço','Salário','Renda extra','Transferência recebida','Outras receitas']:['Mercadorias','Fornecedor','Aluguel','Água e luz','Internet','Transporte','Taxas','Marketing','Alimentação','Moradia','Saúde','Lazer','Impostos','Outros']).map(x=>`<option>${x}</option>`)}</select></div>${incoming?input('De onde veio o dinheiro? (cliente, empresa, plataforma...)','origin',{full:true,placeholder:'Ex.: Cliente João, salário, iFood'}):input('Para quem / onde foi o pagamento?','destination',{full:true,placeholder:'Ex.: fornecedor, mercado, aluguel'})}<div><label>Vencimento (opcional)</label><input name="dueDate" type="date"></div><div><label>Forma / conta</label><select name="account"><option>Pix</option><option>Dinheiro</option><option>Conta bancária</option><option>Cartão</option><option>Outro</option></select></div></div>`}
if(type==='product'){title='Cadastrar produto';fields=`<div class="formgrid">${input('Nome do produto','name',{full:true})}${input('Código / SKU','sku',{required:false})}${input('Quantidade inicial','qty',{type:'number',min:'0',step:'1',value:'0'})}${input('Custo unitário (R$)','cost',{type:'number',min:'0',step:'0.01',value:'0'})}${input('Preço de venda (R$)','price',{type:'number',min:'0',step:'0.01',value:'0'})}${input('Estoque mínimo','min',{type:'number',min:'0',step:'1',value:'0'})}</div>`}
if(type==='sale'){title='Registrar venda / serviço';let opts=db.products.map(p=>`<option value="${p.id}">${esc(p.name)} · ${money(p.price)}</option>`).join('');fields=`<div class="formgrid"><div class="full"><label>Produto (opcional)</label><select name="product"><option value="">Venda avulsa / serviço</option>${opts}</select></div>${input('Descrição','item',{full:true})}${input('Cliente','client',{required:false})}${input('Quantidade','qty',{type:'number',min:'1',step:'1',value:'1'})}${input('Valor total da venda (R$)','total',{type:'number',min:'0.01',step:'0.01'})}<div><label>Data</label><input name="date" type="date" value="${today()}" required></div><div><label>Forma de pagamento</label><select name="payment"><option>Pix</option><option>Dinheiro</option><option>Cartão de débito</option><option>Cartão de crédito</option><option>Transferência</option><option>A prazo</option></select></div></div><small>Ao escolher um produto, o sistema calcula o custo estimado e baixa o estoque. Confira o valor total antes de salvar.</small>`}
if(type==='contact'){title='Novo contato';fields=`<div class="formgrid"><div><label>Tipo</label><select name="kind"><option>Cliente</option><option>Fornecedor</option></select></div>${input('Nome / empresa','name')}${input('Telefone','phone',{required:false})}${input('CPF / CNPJ','doc',{required:false})}<div class="full">${input('E-mail','email',{required:false})}</div></div>`}
if(type==='bill'){title='Cadastrar conta';fields=`<div class="formgrid"><div><label>Tipo</label><select name="kind"><option>Pagar</option><option>Receber</option></select></div>${input('Descrição','desc')}${input('Valor (R$)','amount',{type:'number',min:'0.01',step:'0.01'})}<div><label>Vencimento</label><input name="due" type="date" value="${today()}" required></div><div><label>Categoria</label><select name="category"><option>Fornecedor</option><option>Aluguel</option><option>Serviços</option><option>Cliente</option><option>Outros</option></select></div></div>`}
$('modalTitle').textContent=title;$('form').innerHTML=fields+`<div class="formactions"><button type="button" class="secondary" onclick="closeForm()">Cancelar</button><button class="primary">Salvar</button></div>`;$('modal').classList.add('show');
$('form').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let id=Date.now();
if(type==='tx-in'||type==='tx-out')db.transactions.push({id,scope:f.scope,type:type==='tx-in'?'entrada':'saida',desc:f.desc,amount:+f.amount,date:f.date,category:f.category,account:f.account,origin:f.origin||'',destination:f.destination||'',dueDate:f.dueDate||''});
if(type==='product')db.products.push({id,name:f.name,sku:f.sku,qty:+f.qty,cost:+f.cost,price:+f.price,min:+f.min});
if(type==='sale'){let p=db.products.find(x=>x.id===+f.product),q=+f.qty,total=+f.total;if(p&&p.qty<q){alert('Estoque insuficiente.');return}let cost=p?p.cost*q:0;if(p)p.qty-=q;let item=f.item||(p?p.name:'Venda/serviço');db.sales.push({id,item,client:f.client,qty:q,total,cost,profit:total-cost,date:f.date,payment:f.payment});db.transactions.push({id:id+1,scope:'empresa',type:'entrada',desc:'Venda: '+item,amount:total,date:f.date,category:'Receita de venda',account:f.payment})}
if(type==='contact')db.contacts.push({id,...f});
if(type==='bill')db.bills.push({id,...f,status:'aberta'});
closeForm();persist();}
}
function closeForm(){$('modal').classList.remove('show')}
function removeItem(key,id){if(confirm('Excluir este registro?')){db[key]=db[key].filter(x=>x.id!==id);persist()}}
function settleBill(id){let b=db.bills.find(x=>x.id===id);if(!b)return;if(confirm('Marcar esta conta como paga/recebida e lançar no financeiro?')){b.status='baixada';db.transactions.push({id:Date.now(),scope:'empresa',type:b.kind==='Pagar'?'saida':'entrada',desc:b.desc,amount:+b.amount,date:today(),category:b.category||'Conta',account:'Outro'});persist()}}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-meu-financeiro.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.transactions||!x.products||!x.sales||!x.bills)throw 0;if(confirm('Substituir todos os dados atuais pelo backup?')){db=x;persist();alert('Backup restaurado.')}}catch(_){alert('Arquivo inválido.')}e.target.value=''};r.readAsText(f)}
function clearAll(){if(confirm('Tem certeza? Isso apagará todos os dados deste aparelho. Faça backup antes.')){db=blank;persist()}}
function exportCSV(){let rows=[['Tipo','Data','Descrição','Categoria','Valor','Módulo'],...db.transactions.map(t=>[t.type,t.date,t.desc,t.category,t.amount,t.scope]),...db.sales.map(s=>['venda',s.date,s.item,'Venda',s.total,'empresa'])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='relatorio-meu-financeiro.csv';a.click();URL.revokeObjectURL(a.href)}
render();
</script></body></html>
